name: gold-smc
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: gold-smc
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BASIS: "0"
          RISK_USD: "50"
          STRATEGIES: "smc,orb,pb"
          RUN_SECONDS: "240"
        run: python gold.py live
      - name: Save state
        if: always()
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add -A state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push)
